<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1219">
<meta name="description" content="Отвычка — приложение, чтобы отучаться от привычек: лог триггеров, замещающее действие, пережидание тяги и тренд вместо обнуляемого стрика.">
<title>Отвычка</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#0e1219; --bg2:#141a24; --bg3:#1b2330; --line:#26303f;
  --ink:#e8edf4; --dim:#9aa7b8; --faint:#6b7889;
  --accent:#47c8bd; --accent-2:#2f9d95; --accent-ink:#06201e;
  --warm:#e6a860; --warm-ink:#2a1b06;
  --shadow:0 18px 40px -22px rgba(0,0,0,.7);
  --r:18px; --r-sm:12px;
  --serif:"Fraunces",Georgia,serif;
  --sans:"Hanken Grotesk",system-ui,-apple-system,sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
/* light palette for explicit light choice OR light OS when un-stamped */
:root[data-theme="light"]{
  --bg:#e9edee; --bg2:#ffffff; --bg3:#eef2f3; --line:#d6dde0;
  --ink:#16202b; --dim:#566472; --faint:#8390a0;
  --accent:#158b82; --accent-2:#0f6f68; --accent-ink:#ffffff;
  --warm:#b16a22; --warm-ink:#ffffff;
  --shadow:0 18px 40px -26px rgba(24,40,60,.28);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#e9edee; --bg2:#ffffff; --bg3:#eef2f3; --line:#d6dde0;
    --ink:#16202b; --dim:#566472; --faint:#8390a0;
    --accent:#158b82; --accent-2:#0f6f68; --accent-ink:#ffffff;
    --warm:#b16a22; --warm-ink:#ffffff;
    --shadow:0 18px 40px -26px rgba(24,40,60,.28);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:var(--sans); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; line-height:1.5;
  min-height:100dvh;
}
button{font-family:inherit; cursor:pointer; color:inherit}
input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.app{max-width:460px; margin:0 auto; padding:0 16px calc(120px + env(safe-area-inset-bottom)); position:relative}

/* ---------- header ---------- */
header.top{
  display:flex; align-items:center; justify-content:space-between;
  padding:calc(18px + env(safe-area-inset-top)) 0 10px;
}
.brand{display:flex; align-items:center; gap:10px}
.brand .mark{width:30px; height:30px; flex:none}
.brand h1{
  font-family:var(--serif); font-weight:600; font-size:26px; margin:0;
  letter-spacing:-.01em; font-optical-sizing:auto;
}
.iconbtn{
  width:40px; height:40px; border-radius:12px; border:1px solid var(--line);
  background:var(--bg2); display:grid; place-items:center; color:var(--dim);
}
.iconbtn svg{width:19px; height:19px}

.lede{color:var(--dim); font-size:14.5px; margin:0 2px 18px; max-width:60ch}

/* ---------- home cards ---------- */
.list{display:flex; flex-direction:column; gap:14px}
.card{
  background:var(--bg2); border:1px solid var(--line); border-radius:var(--r);
  padding:16px 16px 14px; box-shadow:var(--shadow); position:relative;
  width:100%; text-align:left; display:block;
}
.card.tap{transition:transform .12s ease}
.card.tap:active{transform:scale(.988)}
.card .row1{display:flex; align-items:flex-start; justify-content:space-between; gap:12px}
.card h3{margin:0; font-size:18px; font-weight:600; letter-spacing:-.01em}
.repl{color:var(--dim); font-size:13.5px; margin:4px 0 0; display:flex; gap:6px; align-items:baseline}
.repl b{color:var(--accent); font-weight:600}
.tag{
  font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint);
  border:1px solid var(--line); border-radius:999px; padding:3px 8px; white-space:nowrap;
}
.trend{
  display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600;
  padding:4px 9px; border-radius:999px; white-space:nowrap;
}
.trend.good{color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent)}
.trend.bad{color:var(--warm); background:color-mix(in srgb,var(--warm) 16%,transparent)}
.trend.flat{color:var(--dim); background:var(--bg3)}
.trend svg{width:13px; height:13px}

/* sparkline */
.spark{display:flex; align-items:flex-end; gap:3px; height:44px; margin:14px 0 12px}
.spark .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:2px; min-width:0}
.spark .seg{border-radius:2px; width:100%}
.spark .seg.w{background:color-mix(in srgb,var(--accent) 78%,transparent)}
.spark .seg.s{background:var(--warm)}
.spark .base{height:2px; border-radius:2px; background:var(--line)}

.stats{display:flex; gap:8px; flex-wrap:wrap}
.stat{
  background:var(--bg3); border-radius:10px; padding:7px 11px; display:flex;
  flex-direction:column; gap:1px; min-width:0;
}
.stat .n{font-family:var(--mono); font-size:15px; font-weight:500; font-variant-numeric:tabular-nums}
.stat .n.w{color:var(--accent)} .stat .n.s{color:var(--warm)}
.stat .l{font-size:11px; color:var(--faint); letter-spacing:.01em}

/* ---------- empty ---------- */
.empty{text-align:center; padding:46px 18px; color:var(--dim)}
.empty .mark{width:52px; height:52px; margin:0 auto 14px; opacity:.9}
.empty h2{font-family:var(--serif); color:var(--ink); font-weight:500; font-size:21px; margin:0 0 6px}
.empty p{font-size:14px; max-width:34ch; margin:0 auto}

/* ---------- floating actions ---------- */
.dock{
  position:fixed; left:0; right:0; bottom:0; z-index:40; pointer-events:none;
  padding:0 16px calc(16px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 55%,transparent);
}
.dock .inner{max-width:460px; margin:0 auto; display:flex; gap:10px; pointer-events:auto}
.btn{
  border:none; border-radius:14px; padding:15px 18px; font-size:15.5px; font-weight:600;
  display:inline-flex; align-items:center; justify-content:center; gap:9px; letter-spacing:-.01em;
}
.btn svg{width:19px; height:19px}
.btn.primary{background:var(--accent); color:var(--accent-ink); flex:1; box-shadow:0 12px 28px -12px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.primary:active{filter:brightness(.96)}
.btn.ghost{background:var(--bg2); border:1px solid var(--line); color:var(--ink); flex:none; width:54px; padding:15px 0}
.btn.ghost svg{width:22px;height:22px}
.btn.block{width:100%}
.btn.warm{background:var(--warm); color:var(--warm-ink)}
.btn.soft{background:var(--bg3); color:var(--ink)}
.btn:disabled{opacity:.45}

/* ---------- sheet / screens ---------- */
.screen{
  position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto;
  transform:translateY(100%); transition:transform .32s cubic-bezier(.22,1,.36,1);
  display:flex; flex-direction:column;
}
.screen.open{transform:translateY(0)}
.screen .head{
  position:sticky; top:0; background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px); z-index:2;
  display:flex; align-items:center; gap:12px; padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--line);
}
.screen .head h2{font-family:var(--serif); font-weight:600; font-size:19px; margin:0; flex:1; letter-spacing:-.01em}
.screen .body{max-width:460px; width:100%; margin:0 auto; padding:18px 16px calc(30px + env(safe-area-inset-bottom)); flex:1}

label.field{display:block; margin:0 0 16px}
label.field .cap{display:block; font-size:12.5px; color:var(--dim); margin:0 0 7px; font-weight:600; letter-spacing:.01em}
label.field .cap .opt{color:var(--faint); font-weight:400}
input.txt,textarea.txt{
  width:100%; background:var(--bg2); border:1px solid var(--line); color:var(--ink);
  border-radius:12px; padding:13px 14px; font-size:16px; line-height:1.4;
}
input.txt:focus,textarea.txt:focus{border-color:var(--accent); outline:none}
textarea.txt{resize:vertical; min-height:64px}
.hint{font-size:12.5px; color:var(--faint); margin:7px 2px 0; line-height:1.5}
.hint b{color:var(--accent-2); font-weight:600}

/* feeling chips */
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  border:1px solid var(--line); background:var(--bg2); color:var(--dim);
  border-radius:999px; padding:9px 14px; font-size:14px; font-weight:500; transition:.12s;
}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent}

/* ---------- surf overlay ---------- */
.surf{position:fixed; inset:0; z-index:80; background:var(--bg); display:none; flex-direction:column; overflow:hidden}
.surf.open{display:flex}
.surf .close{position:absolute; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:5}
.surf .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; position:relative; z-index:2}
.surf .kick{font-family:var(--serif); font-weight:500; font-size:27px; line-height:1.22; margin:0 0 10px; max-width:16ch; text-wrap:balance}
.surf .sub{color:var(--dim); font-size:15px; max-width:26ch; margin:0 0 26px}
.step-actions{display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px}

/* breathing */
.breath{width:230px; height:230px; display:grid; place-items:center; margin:6px 0 22px; position:relative}
.breath .ring{
  position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 50% 45%, color-mix(in srgb,var(--accent) 40%,transparent), color-mix(in srgb,var(--accent) 8%,transparent) 70%);
  transform:scale(.62); animation:breathe 11s ease-in-out infinite;
}
.breath .ring.r2{animation-delay:0s; opacity:.5; filter:blur(6px)}
.breath .core{position:relative; z-index:2; text-align:center}
.breath .phase{font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600}
.breath .time{font-family:var(--mono); font-size:40px; font-weight:500; margin-top:2px; font-variant-numeric:tabular-nums}
@keyframes breathe{
  0%{transform:scale(.6)} 40%{transform:scale(1)} 52%{transform:scale(1)} 100%{transform:scale(.6)}
}
/* waves at the bottom of surf */
.ocean{position:absolute; left:0; right:0; bottom:0; height:38%; z-index:0; overflow:hidden; opacity:.85}
.ocean svg{position:absolute; bottom:0; width:200%; height:100%}
.ocean .w1{animation:drift 13s linear infinite}
.ocean .w2{animation:drift 9s linear infinite reverse; opacity:.55}
@keyframes drift{from{transform:translateX(0)} to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){
  .breath .ring{animation:none; transform:scale(.9)}
  .ocean .w1,.ocean .w2{animation:none}
}

/* ---------- detail ---------- */
.big{display:flex; gap:10px; margin:0 0 18px}
.bigstat{flex:1; background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:14px}
.bigstat .n{font-family:var(--serif); font-size:30px; font-weight:500; line-height:1; letter-spacing:-.02em}
.bigstat .n.w{color:var(--accent)} .bigstat .n.s{color:var(--warm)}
.bigstat .l{font-size:12px; color:var(--dim); margin-top:6px}
.sect{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--faint); font-weight:600; margin:22px 2px 10px}
.plan{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:15px}
.plan .p-if{color:var(--dim); font-size:13px}
.plan .p-then{font-size:16px; margin-top:4px}
.plan .p-then b{color:var(--accent)}
.plan .why{margin-top:12px; padding-top:12px; border-top:1px solid var(--line); font-family:var(--serif); font-size:15px; color:var(--ink); font-style:italic; line-height:1.45}

.log{display:flex; flex-direction:column; gap:1px; border-radius:14px; overflow:hidden; border:1px solid var(--line)}
.ev{display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--bg2)}
.ev .dot{width:9px; height:9px; border-radius:50%; flex:none}
.ev.waited .dot{background:var(--accent)} .ev.slip .dot{background:var(--warm)}
.ev .txt{flex:1; min-width:0}
.ev .t1{font-size:14px; font-weight:600}
.ev .t2{font-size:12.5px; color:var(--faint); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ev .when{font-family:var(--mono); font-size:12px; color:var(--dim); white-space:nowrap}

.chartwrap{background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:16px 14px 10px}
.chartwrap .cap{display:flex; justify-content:space-between; font-size:11px; color:var(--faint); margin-top:8px}
.chart{display:flex; align-items:flex-end; gap:4px; height:96px}
.chart .col{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:2px}
.chart .seg{border-radius:2px}
.chart .seg.w{background:color-mix(in srgb,var(--accent) 80%,transparent)}
.chart .seg.s{background:var(--warm)}
.chart .base{height:2px; background:var(--line); border-radius:2px}

.linkrow{display:flex; gap:10px; margin-top:8px}
.linkbtn{flex:1; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:12px; font-size:14px; font-weight:600; color:var(--ink)}
.linkbtn.danger{color:var(--warm)}

.legend{display:flex; gap:16px; font-size:12px; color:var(--dim); margin:10px 2px 0}
.legend i{width:9px; height:9px; border-radius:2px; display:inline-block; margin-right:6px; vertical-align:middle}
.legend .w{background:var(--accent)} .legend .s{background:var(--warm)}

.toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; font-size:14px; font-weight:600;
  z-index:90; opacity:0; transition:.25s; pointer-events:none; box-shadow:var(--shadow); max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app" id="app"></div>

<div class="dock" id="dock" hidden>
  <div class="inner">
    <button class="btn primary" id="urgeBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2"/><path d="M3 19c2 0 2-2 4-2s2 2 4 2 2-2 4-2 2 2 4 2"/><path d="M12 3v6"/><path d="m9 6 3-3 3 3"/></svg>
      Тяга сейчас
    </button>
    <button class="btn ghost" id="addBtn" type="button" aria-label="Добавить отвычку">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</div>

<!-- Add / edit screen -->
<section class="screen" id="addScreen" aria-hidden="true">
  <div class="head">
    <button class="iconbtn" type="button" data-close="addScreen" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h2 id="addTitle">Новая отвычка</h2>
  </div>
  <div class="body">
    <label class="field">
      <span class="cap">От чего отучаюсь</span>
      <input class="txt" id="f-name" placeholder="Напр. листать телефон в кровати" maxlength="70">
    </label>
    <label class="field">
      <span class="cap">Вместо этого буду <span class="opt">— замещающее действие</span></span>
      <input class="txt" id="f-repl" placeholder="Напр. читать бумажную книгу 5 минут" maxlength="80">
      <p class="hint">Ломать привычку = не «терпеть пустоту», а <b>заменить</b> её. На триггер — сразу это действие.</p>
    </label>
    <label class="field">
      <span class="cap">Зачем мне это <span class="opt">— напоминание в трудный момент</span></span>
      <textarea class="txt" id="f-why" placeholder="Напр. хочу засыпать спокойно и высыпаться" maxlength="160"></textarea>
    </label>
    <label class="field">
      <span class="cap">Пережидать тягу, секунд</span>
      <input class="txt" id="f-secs" type="number" inputmode="numeric" value="120" min="20" max="600" step="10" style="max-width:130px">
      <p class="hint">Тяга — это волна: она нарастает и спадает за пару минут. Столько длится «сёрфинг».</p>
    </label>
    <button class="btn primary block" id="saveBtn" type="button" style="margin-top:6px">Сохранить</button>
  </div>
</section>

<!-- Detail screen -->
<section class="screen" id="detailScreen" aria-hidden="true">
  <div class="head">
    <button class="iconbtn" type="button" data-close="detailScreen" aria-label="Назад">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <h2 id="d-title">—</h2>
    <button class="iconbtn" type="button" id="editBtn" aria-label="Изменить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
  </div>
  <div class="body" id="d-body"></div>
</section>

<!-- Surf overlay -->
<section class="surf" id="surf" aria-hidden="true">
  <button class="iconbtn close" type="button" id="surfClose" aria-label="Закрыть">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <div class="stage" id="surfStage"></div>
  <div class="ocean" aria-hidden="true">
    <svg class="w1" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 90 C150 40 300 140 600 90 C900 40 1050 140 1200 90 L1200 200 L0 200 Z" fill="var(--accent)" opacity="0.30"/></svg>
    <svg class="w2" viewBox="0 0 1200 200" preserveAspectRatio="none"><path d="M0 110 C200 60 400 160 600 110 C800 60 1000 160 1200 110 L1200 200 L0 200 Z" fill="var(--accent)" opacity="0.45"/></svg>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY="otvychka.v1";
const FEELINGS=["скука","стресс","усталость","тревога","по привычке","за компанию","грусть","радость"];
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let db=load();

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw); if(d&&Array.isArray(d.items))return d;}
  }catch(e){}
  return seed();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(db));}catch(e){} }
function seed(){
  const now=Date.now(), day=864e5;
  const ev=[];
  // an example with a realistic, improving trend (more waited than slipped, fewer slips lately)
  const plan=[3,2,1,2,1,1,0,1,2,0,1,0,1,0]; // slips per day, 13d ago -> today
  const urges=[3,4,3,5,4,3,2,4,5,3,4,2,3,2];
  for(let i=13;i>=0;i--){
    const idx=13-i;
    const total=urges[idx], slips=plan[idx];
    for(let k=0;k<total;k++){
      const slipped=k<slips;
      ev.push({id:rid(), ts:now-i*day+((k+1)*37+9)*6e5, outcome:slipped?"slipped":"waited",
        feelings:[FEELINGS[(i+k)%FEELINGS.length]], waited:slipped?0:90+((k*13)%40)});
    }
  }
  return {version:1, items:[{
    id:rid(), name:"Листать телефон в кровати", repl:"читать бумажную книгу 5 минут",
    why:"Хочу засыпать спокойно и высыпаться, а не залипать в ленту до часу ночи.",
    secs:120, createdAt:now-14*day, isExample:true, events:ev
  }]};
}
function rid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}

/* ---------- metrics ---------- */
const DAY=864e5;
function within(events,fromDaysAgo,toDaysAgo){
  const now=Date.now(), lo=now-fromDaysAgo*DAY, hi=now-toDaysAgo*DAY;
  return events.filter(e=>e.ts>=lo && e.ts<hi);
}
function counts(events){
  let w=0,s=0; for(const e of events){ if(e.outcome==="waited")w++; else if(e.outcome==="slipped")s++; } return {w,s};
}
function daysSinceSlip(item){
  const slips=item.events.filter(e=>e.outcome==="slipped").sort((a,b)=>b.ts-a.ts);
  if(!slips.length)return null;
  return Math.floor((Date.now()-slips[0].ts)/DAY);
}
function trend(item){
  const thisWk=counts(within(item.events,7,0)).s;
  const prevWk=counts(within(item.events,14,7)).s;
  if(item.events.length<3) return {dir:"flat",txt:"копим данные"};
  if(thisWk<prevWk) return {dir:"good",txt:"срывов меньше"};
  if(thisWk>prevWk) return {dir:"bad",txt:"срывов больше"};
  return {dir:"flat",txt:"без изменений"};
}
function byDay(events,ndays){
  const now=Date.now();
  // bucket into 24h windows ending now
  const buckets=[];
  for(let i=ndays-1;i>=0;i--){
    const hi=now-i*DAY, lo=hi-DAY;
    const inb=events.filter(e=>e.ts>=lo && e.ts<hi);
    buckets.push(counts(inb));
  }
  return buckets;
}

/* ---------- render home ---------- */
function render(){
  const app=$("#app");
  app.innerHTML="";
  const header=el("header","top");
  const brand=el("div","brand");
  brand.innerHTML=`<span class="mark">${WAVE_MARK}</span><h1>Отвычка</h1>`;
  const theme=el("button","iconbtn");
  theme.type="button"; theme.setAttribute("aria-label","Сменить тему");
  theme.innerHTML=THEME_ICON;
  theme.onclick=toggleTheme;
  header.append(brand,theme);
  app.append(header);

  if(!db.items.length){
    $("#dock").hidden=false;
    const e=el("div","empty");
    e.innerHTML=`<div class="mark">${WAVE_MARK}</div>
      <h2>Ни одной отвычки</h2>
      <p>Добавь то, от чего хочешь отучиться. Дальше — ловим тягу и пережидаем её волной.</p>`;
    app.append(e);
    return;
  }

  const lede=el("p","lede","Тяга — это волна. Не обнуляем стрик при срыве, а смотрим на тренд: становится ли волн меньше.");
  app.append(lede);

  const list=el("div","list");
  for(const it of db.items) list.append(homeCard(it));
  app.append(list);
  $("#dock").hidden=false;
}

function homeCard(it){
  const c=el("button","card tap"); c.type="button";
  const w7=counts(within(it.events,7,0));
  const tr=trend(it);
  const dss=daysSinceSlip(it);

  const row1=el("div","row1");
  const left=el("div"); left.style.minWidth="0";
  const h=el("h3",null,it.name);
  left.append(h);
  const repl=el("p","repl");
  repl.innerHTML=`→ <b>${esc(it.repl||"замена не задана")}</b>`;
  left.append(repl);
  row1.append(left);
  const tEl=el("div",`trend ${tr.dir}`);
  tEl.innerHTML=`${tr.dir==="good"?ARROW_DOWN:tr.dir==="bad"?ARROW_UP:DOT} ${tr.txt}`;
  row1.append(tEl);
  c.append(row1);

  if(it.isExample){ const tg=el("span","tag","пример"); tg.style.position="absolute"; tg.style.top="14px"; tg.style.right="14px"; /* placed via trend instead */ }

  c.append(sparkline(byDay(it.events,14)));

  const stats=el("div","stats");
  stats.append(stat(w7.w,"переждал · 7д","w"));
  stats.append(stat(w7.s,"срывов · 7д","s"));
  stats.append(stat(dss==null?"—":dss, dss==null?"без срывов":"дн. без срыва",""));
  c.append(stats);

  if(it.isExample){
    const note=el("div"); note.style.marginTop="12px"; note.style.fontSize="12.5px"; note.style.color="var(--faint)";
    note.innerHTML=`Это пример. <a href="#" style="color:var(--accent)">Убрать и начать своё →</a>`;
    note.querySelector("a").onclick=(e)=>{e.preventDefault(); e.stopPropagation(); if(confirm("Убрать пример?")){db.items=db.items.filter(x=>x.id!==it.id); save(); render();}};
    c.append(note);
  }

  c.onclick=()=>openDetail(it.id);
  return c;
}
function stat(n,l,cls){
  const s=el("div","stat");
  s.innerHTML=`<span class="n ${cls}">${n}</span><span class="l">${l}</span>`;
  return s;
}
function sparkline(buckets){
  const max=Math.max(1,...buckets.map(b=>b.w+b.s));
  const wrap=el("div","spark");
  for(const b of buckets){
    const col=el("div","col");
    const total=b.w+b.s;
    if(total===0){ col.append(el("div","base")); }
    else{
      if(b.s>0){const s=el("div","seg s"); s.style.height=Math.max(3,(b.s/max)*40)+"px"; col.append(s);}
      if(b.w>0){const w=el("div","seg w"); w.style.height=Math.max(3,(b.w/max)*40)+"px"; col.append(w);}
    }
    wrap.append(col);
  }
  return wrap;
}

/* ---------- detail ---------- */
let currentId=null;
function openDetail(id){
  currentId=id;
  const it=db.items.find(x=>x.id===id); if(!it)return;
  $("#d-title").textContent=it.name;
  const b=$("#d-body"); b.innerHTML="";

  const w7=counts(within(it.events,7,0));
  const dss=daysSinceSlip(it);
  const tot=counts(it.events);

  const big=el("div","big");
  big.append(bigstat(tot.w,"волн пережито","w"));
  big.append(bigstat(dss==null?"—":dss,"дней без срыва",""));
  big.append(bigstat(w7.s,"срывов за 7 дней","s"));
  b.append(big);

  // plan
  b.append(sect("Что делаю вместо"));
  const plan=el("div","plan");
  plan.innerHTML=`<div class="p-if">Когда тянет — вместо того чтобы «${esc(it.name.toLowerCase())}»:</div>
    <div class="p-then">→ <b>${esc(it.repl||"замена не задана")}</b></div>`;
  if(it.why){const why=el("div","why","«"+it.why+"»"); plan.append(why);}
  b.append(plan);

  // chart
  b.append(sect("Тренд за 14 дней"));
  const cw=el("div","chartwrap");
  const buckets=byDay(it.events,14);
  const max=Math.max(1,...buckets.map(x=>x.w+x.s));
  const ch=el("div","chart");
  for(const bk of buckets){
    const col=el("div","col"); const total=bk.w+bk.s;
    if(total===0){col.append(el("div","base"));}
    else{
      if(bk.s>0){const s=el("div","seg s"); s.style.height=Math.max(4,(bk.s/max)*88)+"px"; col.append(s);}
      if(bk.w>0){const w=el("div","seg w"); w.style.height=Math.max(4,(bk.w/max)*88)+"px"; col.append(w);}
    }
    ch.append(col);
  }
  cw.append(ch);
  const cap=el("div","cap"); cap.innerHTML=`<span>14 дней назад</span><span>сегодня</span>`;
  cw.append(cap);
  b.append(cw);
  const lg=el("div","legend");
  lg.innerHTML=`<span><i class="w"></i>переждал</span><span><i class="s"></i>сорвался</span>`;
  b.append(lg);

  // log
  b.append(sect("Что запускает тягу"));
  const trg=triggerSummary(it);
  if(trg) b.append(trg);

  b.append(sect("Журнал"));
  const events=[...it.events].sort((a,b)=>b.ts-a.ts).slice(0,40);
  if(!events.length){
    const e=el("p","hint","Пока пусто. Нажми «Тяга сейчас», когда почувствуешь позыв.");
    b.append(e);
  }else{
    const log=el("div","log");
    for(const e of events) log.append(eventRow(e));
    b.append(log);
  }

  const lr=el("div","linkrow");
  const del=el("button","linkbtn danger","Удалить отвычку"); del.type="button";
  del.onclick=()=>{ if(confirm("Удалить «"+it.name+"» вместе с журналом?")){ db.items=db.items.filter(x=>x.id!==it.id); save(); closeScreen("detailScreen"); render(); } };
  lr.append(del);
  b.append(lr);

  openScreen("detailScreen");
}
function bigstat(n,l,cls){const d=el("div","bigstat"); d.innerHTML=`<div class="n ${cls}">${n}</div><div class="l">${l}</div>`; return d;}
function sect(t){return el("div","sect",t);}
function triggerSummary(it){
  const map={};
  for(const e of it.events){ for(const f of (e.feelings||[])) map[f]=(map[f]||0)+1; }
  const entries=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(!entries.length)return null;
  const total=entries.reduce((s,e)=>s+e[1],0);
  const wrap=el("div","plan");
  for(const [name,n] of entries){
    const row=el("div"); row.style.display="flex"; row.style.alignItems="center"; row.style.gap="10px"; row.style.margin="0 0 9px";
    const label=el("span",null,name); label.style.fontSize="14px"; label.style.width="92px"; label.style.flex="none";
    const barbg=el("div"); barbg.style.cssText="flex:1;height:8px;border-radius:4px;background:var(--bg3);overflow:hidden";
    const bar=el("div"); bar.style.cssText=`height:100%;border-radius:4px;background:var(--accent);width:${Math.round(n/entries[0][1]*100)}%`;
    barbg.append(bar);
    const cnt=el("span",null,String(n)); cnt.style.cssText="font-family:var(--mono);font-size:12px;color:var(--dim);width:22px;text-align:right";
    row.append(label,barbg,cnt); wrap.append(row);
  }
  wrap.lastChild.style.margin="0";
  return wrap;
}
function eventRow(e){
  const row=el("div",`ev ${e.outcome==="waited"?"waited":"slip"}`);
  const dot=el("div","dot");
  const txt=el("div","txt");
  const t1=el("div","t1", e.outcome==="waited"?"Переждал тягу":"Сорвался");
  const feel=(e.feelings||[]).join(", ");
  const t2=el("div","t2", feel? "триггер: "+feel : (e.outcome==="waited"?("выдержал "+Math.round((e.waited||0))+" сек"):"—"));
  txt.append(t1,t2);
  const when=el("div","when",fmtWhen(e.ts));
  row.append(dot,txt,when);
  return row;
}
function fmtWhen(ts){
  const d=new Date(ts), now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  const yest=new Date(now-DAY).toDateString()===d.toDateString();
  const hm=d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  if(sameDay)return "сегодня "+hm;
  if(yest)return "вчера "+hm;
  return d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
}

/* ---------- add / edit ---------- */
let editId=null;
function openAdd(id){
  editId=id||null;
  const it=id?db.items.find(x=>x.id===id):null;
  $("#addTitle").textContent=it?"Изменить отвычку":"Новая отвычка";
  $("#f-name").value=it?it.name:"";
  $("#f-repl").value=it?it.repl:"";
  $("#f-why").value=it?(it.why||""):"";
  $("#f-secs").value=it?it.secs:120;
  openScreen("addScreen");
  setTimeout(()=>$("#f-name").focus(),350);
}
function saveItem(){
  const name=$("#f-name").value.trim();
  if(!name){ toast("Впиши, от чего отучаешься"); $("#f-name").focus(); return; }
  const data={ name, repl:$("#f-repl").value.trim(), why:$("#f-why").value.trim(),
    secs:Math.min(600,Math.max(20,parseInt($("#f-secs").value)||120)) };
  if(editId){ const it=db.items.find(x=>x.id===editId); Object.assign(it,data); it.isExample=false; }
  else{ db.items.unshift({ id:rid(), ...data, createdAt:Date.now(), events:[] }); }
  save(); closeScreen("addScreen");
  if(editId&&currentId===editId){ openDetail(editId); }
  render(); toast(editId?"Сохранено":"Отвычка добавлена");
  editId=null;
}

/* ---------- surf flow ---------- */
let surfState=null, surfTimer=null;
function startUrge(){
  const items=db.items;
  if(!items.length){ openAdd(); return; }
  surfState={itemId:null, feelings:[]};
  openSurf();
  if(items.length===1){ surfState.itemId=items[0].id; stepFeelings(); }
  else stepChoose();
}
function openSurf(){ const s=$("#surf"); s.classList.add("open"); s.setAttribute("aria-hidden","false"); }
function closeSurf(){ const s=$("#surf"); s.classList.remove("open"); s.setAttribute("aria-hidden","true"); if(surfTimer){clearInterval(surfTimer); surfTimer=null;} surfState=null; }

function stepChoose(){
  const stage=$("#surfStage"); stage.innerHTML="";
  stage.append(kick("К чему тянет?",""));
  const acts=el("div","step-actions");
  for(const it of db.items){
    const b=el("button","btn soft block",it.name); b.type="button";
    b.onclick=()=>{surfState.itemId=it.id; stepFeelings();};
    acts.append(b);
  }
  stage.append(acts);
}
function stepFeelings(){
  const stage=$("#surfStage"); stage.innerHTML="";
  stage.append(kick("Что сейчас чувствуешь?","Назвать триггер — уже половина дела. Можно пропустить."));
  const chips=el("div","chips"); chips.style.maxWidth="340px"; chips.style.justifyContent="center";
  for(const f of FEELINGS){
    const ch=el("button","chip",f); ch.type="button"; ch.setAttribute("aria-pressed","false");
    ch.onclick=()=>{ const on=ch.getAttribute("aria-pressed")==="true"; ch.setAttribute("aria-pressed",String(!on));
      if(on)surfState.feelings=surfState.feelings.filter(x=>x!==f); else surfState.feelings.push(f); };
    chips.append(ch);
  }
  stage.append(chips);
  const acts=el("div","step-actions"); acts.style.marginTop="28px";
  const go=el("button","btn primary block","Переждать волну"); go.type="button"; go.onclick=stepSurf;
  acts.append(go);
  stage.append(acts);
}
function stepSurf(){
  const it=db.items.find(x=>x.id===surfState.itemId);
  const stage=$("#surfStage"); stage.innerHTML="";
  const total=it.secs||120; let left=total; const started=Date.now();

  if(it.repl){ const r=el("div"); r.style.cssText="color:var(--accent);font-weight:600;font-size:15px;margin-bottom:2px"; r.textContent="Вместо этого: "+it.repl; stage.append(r); }
  const breath=el("div","breath");
  breath.innerHTML=`<div class="ring r2"></div><div class="ring"></div>
    <div class="core"><div class="phase" id="phase">вдох</div><div class="time" id="tleft">${fmtT(left)}</div></div>`;
  stage.append(breath);
  const sub=el("p","sub"); sub.textContent = it.why? "«"+it.why+"»" : "Тяга нарастает и спадает. Ты не обязан ничего делать — просто дыши, пока волна не пройдёт.";
  if(it.why) sub.style.fontStyle="italic";
  stage.append(sub);

  const acts=el("div","step-actions");
  const done=el("button","btn primary block","Переждал ✓"); done.type="button";
  done.onclick=()=>{ record("waited", Math.round((Date.now()-started)/1000)); };
  const slip=el("button","btn soft block","Всё равно сорвался"); slip.type="button"; slip.style.color="var(--warm)";
  slip.onclick=()=>record("slipped",0);
  acts.append(done,slip);
  stage.append(acts);

  const phaseEl=$("#phase"), tEl=$("#tleft");
  surfTimer=setInterval(()=>{
    left=Math.max(0,total-Math.round((Date.now()-started)/1000));
    tEl.textContent=fmtT(left);
    const cyc=((Date.now()-started)/1000)%11;
    phaseEl.textContent = cyc<4.4?"вдох":cyc<5.7?"держи":"выдох";
    if(left<=0){ clearInterval(surfTimer); surfTimer=null; done.textContent="Волна прошла ✓"; phaseEl.textContent="ты справился"; }
  },250);
}
function record(outcome,waited){
  const it=db.items.find(x=>x.id===surfState.itemId);
  if(it){ it.events.push({id:rid(), ts:Date.now(), outcome, feelings:surfState.feelings.slice(), waited}); it.isExample=false; save(); }
  const stage=$("#surfStage"); if(surfTimer){clearInterval(surfTimer); surfTimer=null;}
  stage.innerHTML="";
  const good=outcome==="waited";
  stage.append(kick(good?"Волна прошла.":"Бывает. Это не ноль.",
    good?"Ты переждал тягу — это и есть тренировка. С каждым разом волна слабее."
        :"Срыв не обнуляет прогресс. Ты записал триггер — теперь знаешь, где ловить в следующий раз."));
  const acts=el("div","step-actions");
  const ok=el("button","btn primary block","Готово"); ok.type="button";
  ok.onclick=()=>{ closeSurf(); render(); if(currentId===surfState?.itemId){} toast(good?"Записано: переждал":"Записано. Идём дальше"); };
  // surfState nulled in closeSurf; grab flag first
  const gflag=good;
  ok.onclick=()=>{ const id=surfState?.itemId; closeSurf(); render(); if(currentId===id&&$("#detailScreen").classList.contains("open"))openDetail(id); toast(gflag?"Записано: переждал":"Записано. Идём дальше"); };
  acts.append(ok);
  stage.append(acts);
}
function kick(title,sub){
  const w=document.createDocumentFragment();
  const k=el("h2","kick",title); w.append(k);
  if(sub){ const s=el("p","sub",sub); w.append(s); }
  return w;
}
function fmtT(s){ const m=Math.floor(s/60), ss=s%60; return m+":"+String(ss).padStart(2,"0"); }

/* ---------- screens plumbing ---------- */
function openScreen(id){ const s=$("#"+id); s.classList.add("open"); s.setAttribute("aria-hidden","false"); }
function closeScreen(id){ const s=$("#"+id); s.classList.remove("open"); s.setAttribute("aria-hidden","true"); }

/* ---------- theme ---------- */
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const sysDark=matchMedia("(prefers-color-scheme:dark)").matches;
  let next;
  if(!cur) next = sysDark?"light":"dark";
  else next = cur==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  try{localStorage.setItem("otvychka.theme",next);}catch(e){}
  $("#theme-meta")&&($("#theme-meta").content = next==="dark"?"#0e1219":"#e9edee");
}
(function initTheme(){ try{const t=localStorage.getItem("otvychka.theme"); if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){} })();

/* ---------- toast ---------- */
let toastT=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1900); }

/* ---------- icons ---------- */
const WAVE_MARK=`<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%"><path d="M2 20c3 0 3-4 6-4s3 4 6 4 3-4 6-4 3 4 6 4 3-4 4-4" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M2 25c3 0 3-3 6-3s3 3 6 3 3-3 6-3 3 3 6 3" stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/><circle cx="16" cy="9" r="2.4" fill="var(--warm)"/></svg>`;
const THEME_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
const ARROW_DOWN=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>`;
const ARROW_UP=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>`;
const DOT=`<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="3"/></svg>`;

/* meta theme id */
(function(){const tm=document.querySelector('meta[name="theme-color"]'); if(tm)tm.id="theme-meta";})();

/* ---------- wire up ---------- */
$("#urgeBtn").onclick=startUrge;
$("#addBtn").onclick=()=>openAdd();
$("#saveBtn").onclick=saveItem;
$("#editBtn").onclick=()=>openAdd(currentId);
$("#surfClose").onclick=closeSurf;
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeScreen(b.dataset.close));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeSurf(); ["addScreen","detailScreen"].forEach(closeScreen);} });

render();

/* ---------- service worker ---------- */
if("serviceWorker" in navigator){ window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
